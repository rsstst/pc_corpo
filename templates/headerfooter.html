{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Corpo | {{title}}</title>
    <link rel="stylesheet" href="{% static 'src/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'src/native-styles.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      background: url("../static/img/bg-pattern.jpg");
    }
    * {
      box-sizing: border-box;
    }
    .mySlides {
      display: none;
    }
    img {
      vertical-align: middle;
    }

    /* Slideshow container */
    .slideshow-container {
      max-width: 1000px;
      height: 430px;
      position: relative;
      margin: auto;
      overflow: hidden;
    }

    /* Next & previous buttons */
    .prev,
    .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      width: auto;
      padding: 16px;
      margin-top: -22px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      transition: 0.6s ease;
      border-radius: 0 3px 3px 0;
      user-select: none;
    }

    /* Position the "next button" to the right */
    .next {
      right: 0;
      border-radius: 3px 0 0 3px;
    }

    /* On hover, add a black background color with a little bit see-through */
    .prev:hover,
    .next:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* The dots/bullets/indicators */
    .dot {
      cursor: pointer;
      height: 15px;
      width: 15px;
      margin: 0 2px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.6s ease;
    }

    .active,
    .dot:hover {
      background-color: #717171;
    }

    /* Fading animation */
    .fade {
      animation-name: fade;
      animation-duration: 1.5s;
    }

    @keyframes fade {
      from {
        opacity: 0.4;
      }
      to {
        opacity: 1;
      }
    }

    /* On smaller screens, decrease text size */
    @media only screen and (max-width: 300px) {
      .prev,
      .next,
      .text {
        font-size: 11px;
      }
    }
  </style>
  <body>
    {% block header %}
    <section id="carousel" class="p-2">
      <div class="slideshow-container">
        <div class="mySlides fade">
          <img src="{% static 'img/carousel-1.jpg' %}" style="width: 100%" />
        </div>

        <div class="mySlides fade">
          <img src="{% static 'img/carousel-2.jpeg' %}" style="width: 100%" />
        </div>

        <div class="mySlides fade">
          <img src="{% static 'img/carousel-3.webp' %}" style="width: 100%" />
        </div>

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
      </div>
      <br />

      <div style="text-align: center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
      </div>
    </section>

    <section id="header" class="p-4">
      <div
        class="m-auto border-solid border-white border-2 rounded-xl p-4 flex flex-row w-fit"
      >
        <div
          class="text-center justify-center items-center flex flex-auto space-x-8"
        >
          <a href="/"
            ><img src="{% static 'img/logo.png' %}" alt="" class="w-12 h-auto"
          /></a>

          <a href="/produk" class="p-2 hover:text-slate-300">List Produk</a>
          <a href="/faq" class="p-2 hover:text-slate-300">FAQs</a>
          <a href="/about" class="p-2 hover:text-slate-300">Tentang Kami</a>
          <a href="/register" class="p-2 hover:text-slate-300">Register</a>
          <a href="/dashboard" class="p-2 hover:text-slate-300">Dashboard Admin</a>
        </div>
      </div>
    </section>
    {% endblock %}

    {% block content %} {% endblock %}


    <section id="footer" class="p-4 cursor-default">
      <div
        class="text-center justify-center border-solid border-white border-2 p-4 flex flex-row space-x-8 w-[1000px] m-auto"
      >
        <p>Dibuat untuk menyelesaikan tugas kuliah</p>
      </div>
    </section>

    <script>
      let slideIndex = 1;
      showSlides(slideIndex);

      function plusSlides(n) {
        showSlides((slideIndex += n));
      }

      function currentSlide(n) {
        showSlides((slideIndex = n));
      }

      function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");
        if (n > slides.length) {
          slideIndex = 1;
        }
        if (n < 1) {
          slideIndex = slides.length;
        }
        for (i = 0; i < slides.length; i++) {
          slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
          dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex - 1].style.display = "block";
        dots[slideIndex - 1].className += " active";
      }
    </script>
  </body>
</html>
