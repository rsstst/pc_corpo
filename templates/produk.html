{% extends 'headerfooter.html' %} {% load static %} {% block content %}

            <img class='w-80 h-80 m-auto p-4'src="{{ Barang.link_gambar }}" alt="{{ Barang.nama }}">
            <p>{{ Barang.nama }}</p>
            <div class='space-x-8'>
                <a class='hover:text-slate-300' href="">Beli</a>
                <a class='hover:text-slate-300' href="">Detail</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock %}
